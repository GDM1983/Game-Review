/* ---- KPI tiles: each player's innings, and the team's ---- */
function kpiVals(kind, a){
  const x = rateOut(a);
  return kind==='bat'
    ? [['S/R', x.sr!=null?f1(x.sr):'–'], ['Dot %', x.dotPct], ['4s/6s %', x.bndPct], ['Balls per boundary', x.bpb]]
    : [['E/R', x.er!=null?f2(x.er):'–'], ['Dot %', x.dotPct], ['4s/6s %', x.bndPct], ['Balls per boundary', x.bpb]];
}
function kpiTiles(vals){ return vals.map(([l,v])=>`<div class="kt"><div class="kt-v">${v}</div><div class="kt-l">${l}</div></div>`).join(''); }
/* one innings of one player: arg "batters:id:1" */
function playerKpiInner(arg){
  const [list, id, n] = arg.split(':'); const p = G()[list].find(x=>x.id===id); if(!p) return '';
  const inn = (list==='batters' ? batInns(p) : bowlInns(p));
  const one = list==='batters'
    ? [{r:p['i'+n+'r'], b:p['i'+n+'b'], d:p['i'+n+'d'], f:p['i'+n+'f'], s:p['i'+n+'s']}]
    : [{r:p['i'+n+'r'], b:has(p['i'+n+'o'])?String(oversToBalls(p['i'+n+'o'])):'', d:p['i'+n+'d'], f:p['i'+n+'f'], s:p['i'+n+'s']}];
  return kpiTiles(kpiVals(list==='batters'?'bat':'bowl', rateSums(one)));
}
function playerKpiHtml(p, list, n){ return `<div class="kt-row" data-live="pKpi" data-arg="${list}:${p.id}:${n}">${playerKpiInner(`${list}:${p.id}:${n}`)}</div>`; }
/* team: every batter's (or bowler's) figures for one innings (1, 2) or the match (0) */
function teamSums(games, kind, inn){
  const a = rateSums([]), list = kind==='bat' ? 'batters' : 'bowlers';
  games.forEach(g=>g[list].forEach(p=>{
    const all = kind==='bat' ? batInns(p) : bowlInns(p);
    const pick = inn ? [1,2].filter(n=>n===inn) : [1,2];
    pick.forEach(n=>{ const x = kind==='bat'
      ? {r:p['i'+n+'r'], b:p['i'+n+'b'], d:p['i'+n+'d'], f:p['i'+n+'f'], s:p['i'+n+'s']}
      : {r:p['i'+n+'r'], b:has(p['i'+n+'o'])?String(oversToBalls(p['i'+n+'o'])):'', d:p['i'+n+'d'], f:p['i'+n+'f'], s:p['i'+n+'s']};
      if(kind==='bat' ? has(x.r) : has(x.b)) rateSums([x], a); });
  }));
  return a;
}
function teamKpiInner(kind){
  const g = G(), multi = !isLtd(g);
  const rows = multi ? [['Match',0],['1st innings',1],['2nd innings',2]] : [['',0]];
  return rows.map(([l,inn])=>{ const a = teamSums([g], kind, inn); if(inn && !a.srBalls && !a.dotBalls && !a.bnds) return '';
    return `${l?`<div class="kt-cap">${l}</div>`:''}<div class="kt-row team">${kpiTiles(kpiVals(kind, a))}</div>`; }).join('');
}
function teamKpiPanel(kind){
  return `<div class="kpi-head">Team ${kind==='bat'?'batting':'bowling'} KPIs</div><div data-live="teamKpi" data-arg="${kind}">${teamKpiInner(kind)}</div>`;
}
function teamKpiText(g, kind){
  const v = kpiVals(kind, teamSums([g], kind, 0)).filter(([,x])=>x!=='–');
  return v.map(([l,x])=>`${l} ${x}`).join(', ');
}

/* ============================= BALL-BY-BALL READER =============================
   Reads the text copied from a PlayCricket / PlayHQ "Ball by ball" page (one innings).
   Each delivery appears as an over.ball line (e.g. "74.5") followed by "Bowler to Batter : outcome".
   Dismissal cards ("Full Name / c: …, b: … / R n / B n / 4s n / 6s n") give each dismissed batter's full name. */
function parseBallByBall(text){
  const lines = (text||'').split(/\r?\n/).map(l=>l.trim());
  const balls = [], cards = [], overBowler = {}, unread = [];
  let team = '', topScore = null;
  for(let i=0;i<lines.length;i++){
    const l = lines[i];
    // over summary: "Over 75. 7 runs. Bowler: Daniel Wilczynski. Queensland: 281/10(rr 3.75)"
    let m = l.match(/^Over (\d+)\. .*?Bowler: (.+?)\. (.+?): (\d+)\/(\d+)/);
    if(m){ overBowler[+m[1]] = m[2]; if(!team) team = m[3]; if(topScore===null) topScore = {over:+m[1], runs:+m[4], wkts:+m[5]}; continue; }
    if(!/^\d+\.\d$/.test(l)) continue;
    const d = lines[i+1]||'';
    m = d.match(/^(Out!\s*([A-Za-z ]+?)\.\s*)?(.+?) to (.+?) : (.+)$/);
    if(!m){ continue; }
    const ball = {ov:l, over: Math.floor(parseFloat(l))+1, bowler:m[3].trim(), batter:m[4].trim(), out: !!m[1], how:(m[2]||'').trim(),
      bat:0, nb:0, wd:0, b:0, lb:0};
    const res = m[5].trim();
    if(ball.out){
      const extra = res.replace(/^.*?dismissed\s*,?\s*/i,'');   // e.g. a run out after runs were taken
      parseOutcome(extra, ball);
      // dismissal card follows: full name, dismissal text, R, B, 4s, 6s
      const card = readCard(lines, i+2);
      if(card) cards.push(Object.assign(card, {short: ball.batter, how: ball.how}));
    } else if(!parseOutcome(res, ball)) unread.push(`${l} ${d}`);
    balls.push(ball);
  }
  balls.reverse();   // the page lists the latest ball first
  return summarise(balls, cards, overBowler, team, topScore, unread);
}
function parseOutcome(res, ball){
  if(!res) return true;
  let ok = true;
  res.split(',').map(x=>x.trim()).filter(Boolean).forEach(t=>{
    let m;
    if(/^no run$/i.test(t)) return;
    if((m = t.match(/^(\d+) runs?$/i))) ball.bat += +m[1];
    else if((m = t.match(/^(\d+)\s*nb$/i))) ball.nb += +m[1];
    else if((m = t.match(/^(\d+)\s*(wd|wides?|w)$/i))) ball.wd += +m[1];
    else if((m = t.match(/^(\d+)\s*lb$/i))) ball.lb += +m[1];
    else if((m = t.match(/^(\d+)\s*b$/i))) ball.b += +m[1];
    else if(/^wide$/i.test(t)) ball.wd += 1;
    else if(/^no ?ball$/i.test(t)) ball.nb += 1;
    else ok = false;
  });
  return ok;
}
function readCard(lines, start){
  const seq = []; let j = start;
  while(j < lines.length && seq.length < 16){ if(lines[j]) seq.push(lines[j]); if(lines[j]==='SR'){ seq.push(lines[j+1]||'', lines[j+2]||''); break; } j++; }
  const name = seq[0], at = k=>{ const x = seq.indexOf(k); return x>=0 ? seq[x+1] : null; };
  if(!name || at('R')===null) return null;
  return {name, dismissal: seq[1]&&!/^R$/.test(seq[1]) ? seq[1] : '', r:+at('R'), b:+at('B'), f:+at('4s'), s:+at('6s')};
}
function summarise(balls, cards, overBowler, team, topScore, unread){
  const bat = new Map(), bowl = new Map(), overs = new Map();
  const getBat = n=>{ if(!bat.has(n)) bat.set(n, {short:n, r:0, b:0, d:0, f:0, s:0, out:false}); return bat.get(n); };
  const getBowl = n=>{ if(!bowl.has(n)) bowl.set(n, {short:n, balls:0, r:0, w:0, d:0, f:0, s:0, overs:new Map()}); return bowl.get(n); };
  let total = 0, legal = 0;
  const parts = []; let cur = {runs:0, names:[]};
  balls.forEach(x=>{
    cur.runs += x.bat + x.nb + x.wd + x.b + x.lb; if(!x.wd && !cur.names.includes(x.batter)) cur.names.push(x.batter);
    if(x.out){ parts.push({wicket:parts.length+1, runs:cur.runs, names:cur.names.slice(), out:x.batter}); cur = {runs:0, names:cur.names.filter(n=>n!==x.batter)}; }
    const isLegal = !x.nb && !x.wd;
    const conceded = x.bat + x.nb + x.wd;                 // byes and leg byes aren't against the bowler
    total += x.bat + x.nb + x.wd + x.b + x.lb;
    const p = getBat(x.batter);
    if(!x.wd){ p.b++; }                                   // a no-ball still counts as a ball faced
    p.r += x.bat; if(x.bat===4) p.f++; if(x.bat===6) p.s++;
    if(isLegal && x.bat===0) p.d++;
    if(x.out) p.out = true;
    const w = getBowl(x.bowler);
    if(isLegal){ w.balls++; legal++; if(conceded===0) w.d++; }
    w.r += conceded; if(x.bat===4) w.f++; if(x.bat===6) w.s++;
    if(x.out && !/run ?out|retired|obstruct/i.test(x.how)) w.w++;
    const ov = w.overs.get(x.over) || {balls:0, r:0}; if(isLegal) ov.balls++; ov.r += conceded; w.overs.set(x.over, ov);
    const o = overs.get(x.over) || {over:x.over, r:0, w:0, balls:0, d:0, f:0, s:0};
    o.r += x.bat + x.nb + x.wd + x.b + x.lb; if(x.out) o.w++; if(isLegal){ o.balls++; if(x.bat+x.nb+x.wd+x.b+x.lb===0) o.d++; } if(x.bat===4) o.f++; if(x.bat===6) o.s++;
    overs.set(x.over, o);
  });
  // full names: dismissal cards for batters, over summaries for bowlers
  const batters = [...bat.values()].map(p=>{
    const c = cards.find(c=>c.short===p.short);
    if(c){ p.name = c.name; p.check = {r:c.r, b:c.b, f:c.f, s:c.s}; } else p.name = p.short;
    return p;
  });
  const fullBowler = {};
  balls.forEach(x=>{ const n = overBowler[x.over]; if(n && n!=='********' && x.bowler!=='********') fullBowler[x.bowler] = n; });
  const bowlers = [...bowl.values()].map(w=>({...w, name: w.short==='********' ? '' : (fullBowler[w.short]||w.short), hidden: w.short==='********',
    maidens: [...w.overs.values()].filter(o=>o.balls===6 && o.r===0).length, oversText: ballsToOvers(w.balls)}));
  const wkts = balls.filter(x=>x.out).length;
  if(cur.runs || cur.names.length>1) parts.push({wicket:parts.length+1, runs:cur.runs, names:cur.names.slice(-2), unbroken:true});
  const nameOf = sh=>{ const p = batters.find(b=>b.short===sh); return p ? p.name : sh; };
  parts.forEach(p=>{ p.batters = p.names.slice(-2).map(nameOf).join(' & '); });
  return {balls, team, total, wkts, parts, topScore, legal, oversText: ballsToOvers(legal), batters, bowlers, overs:[...overs.values()].sort((a,b)=>a.over-b.over), unread, count: balls.length};
}
/* Innings totals listed in the page header: "1st QUE / 281", "2nd QUE / 6d-392" */
function bbbHeaderInnings(text){
  const out = [], ls = (text||'').split(/\r?\n/).map(l=>l.trim());
  ls.forEach((l,i)=>{ const m = l.match(/^(1st|2nd) ([A-Z]{2,4})$/); if(m){ const v = (ls[i+1]||'').match(/^(?:(\d+)d?-)?(\d+)/); if(v) out.push({inn: m[1]==='1st'?1:2, code:m[2], runs:+v[2], dec:/^\d+d-/.test(ls[i+1])}); } });
  return out;
}
/* Match details from the page header: round, venue, the two teams and the result line. */
function bbbHeaderMeta(text){
  const ls = (text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const meta = {};
  const ri = ls.findIndex(l=>/^Round \d+/i.test(l));
  if(ri>=0){ meta.round = ls[ri].replace(/^Round\s*/i,''); const v = (ls[ri+1]||'').match(/\+(.+)$/); if(v) meta.venue = v[1].trim(); }
  const res = ls.find(l=>/ won by | match drawn|^drawn|tied|abandoned|no result/i.test(l));
  if(res) meta.result = res;
  const ci = ls.indexOf('COMPLETED'); const si = ls.findIndex(l=>/^Scorecard$/.test(l));
  const teams = ls.slice(ri>=0?ri+1:0, si>0?si:ls.length).filter(l=>/^[A-Z][A-Za-z .'-]{3,}$/.test(l) && !/^(Skip|Play|Program|Community|Competitions|Stats|PlayHQ|Support|Search|Round|COMPLETED|Scorecard|Toyota)/.test(l));
  meta.teams = [...new Set(teams)].filter(t=>!/ won by /.test(t));
  return meta;
}

/* match a scorecard name ("S Geyer" or "Scott Geyer") to a player already in the match or season */
function bbbMatchName(name, short){
  const g = G(), pool = [...new Set([...g.batters, ...g.bowlers].map(p=>(p.name||'').trim()).filter(Boolean).concat(playerNames(S())))];
  const exact = pool.find(n=>pkey(n)===pkey(name)); if(exact) return exact;
  const src = (short||name).trim().split(/\s+/); const sur = src.slice(1).join(' ').toLowerCase(), ini = (src[0]||'')[0];
  const hit = pool.filter(n=>{ const w = n.trim().split(/\s+/); return w.slice(1).join(' ').toLowerCase()===sur && (w[0]||'')[0]===ini; });
  if(hit.length!==1) return name;
  const shortOnly = w=>w.trim().split(/\s+/)[0].length<=2;
  return (shortOnly(hit[0]) && !shortOnly(name)) ? name : hit[0];   // a full name beats an initial
}
/* once a full name is known, replace "S Geyer" style names already saved in this match */
function bbbUpgradeNames(g, full){
  const w = full.trim().split(/\s+/); if(w[0].length<=2) return;
  const short = `${w[0][0]} ${w.slice(1).join(' ')}`;
  [...g.batters, ...g.bowlers].forEach(p=>{ if(pkey(p.name)===pkey(short)) p.name = full; });
  [...g.batMilestones, ...g.bowlMilestones].forEach(m=>{ if(pkey(m.player)===pkey(short)) m.player = full; });
  g.partnerships.forEach(p=>{ p.batters = (p.batters||'').split(' & ').map(x=>pkey(x)===pkey(short)?full:x).join(' & '); });
}
function bbbRead(text){

}

/* ---- Deliveries kept on the match (g.bbb), so player review documents can be made from them ----
   One record per innings: g.bbb["bat1"] = QLD batting 1st innings, g.bbb["bowl2"] = QLD bowling 2nd innings.
   Each ball is "over.ball,bowler,batter,result" with names as indexes into the record's name list. */
function bbbStore(g, side, n, r, rows){
  const qld = {}; rows.forEach(x=>{ if((x.name||'').trim()) qld[x.p.short] = x.name.trim(); });
  const oppFull = {};
  (side==='bat' ? r.bowlers : r.batters).forEach(p=>{ oppFull[p.short] = p.hidden || p.short==='********' ? '' : (p.name||p.short); });
  const names = [], idx = n=>{ let i = names.indexOf(n); if(i<0){ names.push(n); i = names.length-1; } return i; };
  const nm = (short, isQld)=> isQld ? (qld[short] || short) : (oppFull[short] ?? short);
  const enc = r.balls.map(x=>{
    const bw = nm(x.bowler, side==='bowl'), bt = nm(x.batter, side==='bat');
    const ex = ['nb','wd','b','lb'].filter(k=>x[k]).map(k=>`+${x[k]}${k}`).join('');
    return `${x.ov},${idx(bw)},${idx(bt)},${x.bat}${ex}${x.out?'!'+(x.how||'Out'):''}`;
  }).join(';');
  g.bbb = g.bbb || {};
  g.bbb[side+n] = {team:r.team, names, balls:enc};
}
function bbbBalls(rec){
  if(!rec || !rec.balls) return [];
  return rec.balls.split(';').map(s=>{
    const [ov, bw, bt, res] = s.split(','); const m = res.match(/^(\d+)((?:\+\d+[a-z]+)*)(?:!(.*))?$/) || [];
    const x = {ov, over: Math.floor(parseFloat(ov))+1, bowler: rec.names[+bw]||'', batter: rec.names[+bt]||'', bat:+(m[1]||0), nb:0, wd:0, b:0, lb:0, out: m[3]!==undefined, how: m[3]||''};
    (m[2]||'').replace(/\+(\d+)([a-z]+)/g, (_,v,k)=>{ x[k] = +v; return ''; });
    return x;
  });
}

function bbbApply(){
  const g = G(), s = S(), r = bbb.r, bat = bbb.side==='bat', n = bbb.inn, list = bat ? 'batters' : 'bowlers';

  bbb.rows.forEach(x=>{

    const p = x.p, set = (k,v)=>{ pl['i'+n+k] = String(v); };
    if(bat){ const c = p.check||{}; set('r', c.r??p.r); set('b', c.b??p.b); set('f', c.f??p.f); set('s', c.s??p.s); set('d', p.d); pl['i'+n+'no'] = !p.out; }

      const w = r.balls.filter(x=>x.out && x.over>=a && x.over<=b).length;

  }

  const dec = bbbHeaderInnings(bbb.text).some(h=>h.code===(r.team||'').slice(0,3).toUpperCase() && h.inn===n && h.dec);
  g.scores[k] = `${r.wkts}/${runs}`; if(dec){ g.dec = g.dec||{}; g.dec[k] = true; }

    r.parts.filter(p=>p.runs>0).forEach(p=>g.partnerships.push(Object.assign(newPartnership(), {runs:String(p.runs), wicket:WICKETS[p.wicket-1]||'', batters:p.batters.split(' & ').map(x=>bbbMatchName(x,x)).join(' & '), innings:String(n), auto:true})));
  }

  g[msList] = g[msList].filter(m=>!(m.auto && m.innings===String(n)));
  bbb.rows.forEach(x=>{ const name = (x.name||'').trim(); if(!name) return; const p = x.p;
    const val = bat ? ((p.check||{}).r ?? p.r) : p.w;
    const hit = types.map(t=>({t, v:parseInt(t)})).filter(o=>!isNaN(o.v) && val>=o.v).sort((a,b)=>b.v-a.v)[0];
    if(hit) g[msList].push(Object.assign(newMilestone(hit.t), {player:name, detail: bat ? `${val}${p.out?'':'*'} (${(p.check||{}).b ?? p.b})` : `${p.w}/${p.r}`, innings:String(n), auto:true}));
  });
  // limited overs: the overs breakdown for that innings

    segs(g, side).forEach(sg=>{
      const [a,b] = sg.key==='pp' ? [1, FORMATS.t20.pp] : fmtOf(g)==='od' ? [+sg.key*10+1, +sg.key*10+10] : sg.key.split('-').map(Number);
      const ov = r.overs.filter(o=>o.over>=a && o.over<=b); if(!ov.length) return;
      const t = ov.reduce((m,o)=>({balls:m.balls+o.balls, r:m.r+o.r, w:m.w+o.w, d:m.d+o.d, f:m.f+o.f, s:m.s+o.s}), {balls:0,r:0,w:0,d:0,f:0,s:0});
      Object.assign(sg.data, {overs:ballsToOvers(t.balls), runs:String(t.r), wkts:String(t.w), dots:String(t.d), fours:String(t.f), sixes:String(t.s)});

  if(!g.result && m.result){ const x = m.result; g.result = /drawn|draw/i.test(x) ? 'Draw' : /tied/i.test(x) ? 'Tie' : /abandoned|no result/i.test(x) ? 'Abandoned' : / won by /i.test(x) ? (isQldTeam(x.split(/ won by /i)[0]) ? 'Win' : 'Loss') : ''; }
  touchGame(g); closeModal(); render();
  toast(`Filled ${plural(filled, bat?'batter':'bowler')}, ${n===1?'1st':'2nd'} innings`);
  publishReviews(true);
}

function batEntry(g, n, name){
  const rec = (g.bbb||{})['bat'+n]; if(!rec) return null;
  const bs = bbbBalls(rec); let runs = 0, wk = 0, lastWk = {ov:'0.1', w:0, r:0}, entry = null, exit = null; const order = [];
  bs.forEach(x=>{
    if(!order.includes(x.batter) && !x.wd) order.push(x.batter);

const AN_SPIN = /break|orthodox|wrist|spin|chinaman/i;
function anCells(items){

    let r = rows.find(r=>Math.abs(r.y-y)<2.5); if(!r){ r = {y, it:[]}; rows.push(r); } r.it.push({x, w:t.width, s:t.str}); });

    r.it.forEach(i=>{ if(cur && i.x-end <= 6){ if(i.x-end > 1.2 && !/\s$/.test(cur.s) && !/^\s/.test(i.s)) cur.s += ' '; cur.s += i.s; }

/* wagon wheels: straight lines out from a centre; the 8 pale spokes give the boundary radius */
function anWheels(gr){

    const spokes = gp.l.filter(l=>(l.col||[]).join(',')==='213,223,198');
    if(spokes.length<8) return null;

      return [Math.round(Math.atan2(dy,dx)*180/Math.PI), Math.min(100, Math.round(Math.hypot(dx,dy)*100)), AN_COL(l.col)]; });

const AN_PCOL = c=>{ const k = (c||[]).join(','); return k==='47,111,143' ? 0 : k==='201,185,143' ? 1 : k==='163,40,28' ? 4 : k==='17,17,17' ? 'W' : null; };

      .filter(d=>d.x>=xa && d.x<=xb && d.y>=ya && d.y<=yb)
      .map(d=>[Math.round((d.x-xa)/(xb-xa)*100), Math.round((yb-d.y)/(yb-ya)*100), d.c]);   // y: 0 = batter's stumps (top)

const AN_BAT_KEYS = ['Scoring areas','Weakness','Dismissal','Pace v spin','Pressure','Entry'];
const AN_BOWL_KEYS = ['By innings','Variation','Deliveries coded','Matchups','Phases','Spells','Under pressure'];

async function readAnalystPdf(pdf, OPS, onPage){
  const A = {teams:[], innings:[], bat:[], bowl:[], types:{}, lists:{}, recs:{}, fielding:{}};
  let team = '', sub = '', inPlayer = false, rec = null, field = null;
  const listAdd = (k, v)=>{ (A.lists[k] = A.lists[k]||[]).push(v); };

      const t = L.find(l=>/ v /.test(l.text) && !/·/.test(l.text) && l.y>760); if(t) A.title = t.text;
      const res = L.find(l=>/ won by | drawn| tied/i.test(l.text)); if(res) A.result = res.text.replace(/\s*\(.*$/,'');
      L.forEach(l=>{ const m = l.text.match(/Venue (.+)$/); if(m) A.venue = m[1]; const d = l.text.match(/Date (\d{4}-\d{2}-\d{2})/); if(d) A.date = d[1]; });

      A.innings = cells.filter(s=>/^\d+\/\d+$/.test(s)).map((sc,i)=>({inn:i+1, score:sc, team:(sides[i]||'').replace(/ · .*$/,''), overs:(sides[i]||'').replace(/^.* · /,'').replace(/ ov$/,'')}));

      if((m = l.text.match(/^(.+?) \| inns (\d) · #(\d+) · (Right|Left)-hand$/))){ heads.push({kind:'bat', i, y:l.y, team, name:m[1], inn:+m[2], pos:+m[3], hand:m[4][0]}); inPlayer = true; return; }
      if(l.cells.length===2 && L[i+1] && / ov · \d+-\d+ · econ/.test(L[i+1].text)){ heads.push({kind:'bowl', i, y:l.y, team, name:l.cells[0].s, type:l.cells[1].s}); inPlayer = true; return; }

      const tm = teamOf(l.text);
      if(tm && (l.text===tm || / (batting|bowling|in the field|captaincy in the field)$/.test(l.text))){ team = tm; sub = ''; inPlayer = false; rec = null; field = (/ in the field$/.test(l.text) && !/captaincy/.test(l.text)) ? (A.fielding[tm] = {items:{}, lapses:[]}) : null; return; }
      if((m = l.text.match(/^(.+?, .+?) \| (Batting|Bowling)$/))){ rec = `${anName(m[1])}|${m[2]==='Batting'?'bat':'bowl'}`; A.recs[rec] = A.recs[rec]||[]; inPlayer = false; return; }
      if(inPlayer) return;
      if(field){
        if(/^Fielding lapses:/.test(l.text)){ field.inLapse = true; return; }
        if(field.inLapse && c0.x>60){ if(/^Inns \d/.test(l.text)) field.lapses.push(l.text); else if(field.lapses.length) field.lapses[field.lapses.length-1] += ' '+l.text; return; }

        if(c0.x<70 && field.pending){ field.items[c0.s] = field.pending; field.pending = ''; field.justSet = c0.s; }
        return;
      }
      if(rec && c0.x>60 && c0.x<75){ const arr = A.recs[rec]; if(/^[A-Z][A-Za-z ]+:/.test(l.text) || !arr.length) arr.push(l.text); else arr[arr.length-1] += ' '+l.text; return; }
      if(c0.x>50 && c0.x<60 && l.cells.length===1 && l.text.length<70){ sub = l.text.replace(/:$/,''); rec = null; return; }

        const n = head.match(/^(\d+) \((\d+)\) SR ([\d.]+) · 4s (\d+) 6s (\d+) · boundary ([\d.]+)% · dot ([\d.]+)% · attack ([\d.]+)% · false ([\d.–-]+)%?/) || [];
        const tStart = body.findIndex(l=>/^v bowler \| Type/.test(l.text));

        const rows = tStart<0 ? [] : body.slice(tStart+1).filter(l=>l.cells.length>=5 && /^\d+$/.test(l.cells[2].s)).map(l=>({bowler:anName(l.cells[0].s), type:l.cells[1].s, r:+l.cells[2].s, b:+l.cells[3].s, sr:l.cells[4].s, out:!!(l.cells[5] && l.cells[5].s==='W')}));
        const wh = wheels.find(w=>mine(w));

          r:+n[1]||0, b:+n[2]||0, sr:n[3]||'', f:+n[4]||0, s:+n[5]||0, bnd:n[6]||'', dot:n[7]||'', attack:n[8]||'', fals:n[9]||'',
          notes:anSplitBullets(right, AN_BAT_KEYS), vs:rows, wheel: wh ? wh.shots : []});

        A.types[anName(h.name)] = AN_SPIN.test(h.type) ? 'spin' : 'pace';
        const head = body[0] ? body[0].text : '';
        const n = head.match(/^([\d.]+) ov · (\d+)-(\d+) · econ ([\d.]+) · dots ([\d.]+)% · boundaries ([\d.]+)% · maidens (\d+) · wides (\d+), no-balls (\d+)/) || [];
        const R = l=>l.cells.filter(c=>c.x>=200).map(c=>c.s);
        const lenStart = body.findIndex(l=>R(l)[0]==='Length'), vStart = body.findIndex(l=>R(l)[0]==='v batter');
        const lens = [];
        if(lenStart>=0) body.slice(lenStart+1, vStart<0?body.length:vStart).forEach(l=>{ const c = R(l); if(c.length===6 && /^[\d.]+$/.test(c[1])) lens.push({len:c[0], pct:c[1], balls:+c[2], econ:c[3], w:+c[4], bdry:c[5]}); });
        const right = body.slice(1, vStart<0?body.length:vStart).map(l=>R(l).join(' ')).filter(Boolean).join(' ').replace(/PROXY:.*?(tracking\.|tracked)/g,'');
        const rows = vStart<0 ? [] : body.slice(vStart+1).map(R).filter(c=>c.length===5 && /^\d+$/.test(c[1])).map(c=>({batter:anName(c[0]), b:+c[1], r:+c[2], w:+c[3], sr:c[4]}));
        const pm = pitches.find(p=>p.top<=h.y+5 && p.top>nextY);

          lengths:lens, notes:anSplitBullets(right, AN_BOWL_KEYS), vs:rows,

      }

}

let pdfJsLoading = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfJsLoading) return pdfJsLoading;
  const base = ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/'];
  pdfJsLoading = new Promise((res, rej)=>{
    const tryNext = i=>{ if(i>=base.length){ pdfJsLoading = null; rej(new Error('load')); return; }
      const sc = document.createElement('script'); sc.src = base[i]+'pdf.min.js';
      sc.onload = ()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = base[i]+'pdf.worker.min.js'; res(window.pdfjsLib); };
      sc.onerror = ()=>{ sc.remove(); tryNext(i+1); }; document.head.appendChild(sc); };
    tryNext(0);
  });
  return pdfJsLoading;
}
/* names: "First [M] Surname" match when the surname and first initial agree (Jack / Jackson Sinfield) */
function nmSame(a, b){

  const A = a.trim().split(/\s+/), B = b.trim().split(/\s+/);
  return A.length>1 && B.length>1 && A[A.length-1].toLowerCase()===B[B.length-1].toLowerCase() && A[0][0].toLowerCase()===B[0][0].toLowerCase();
}
const anRaw = n=>{ const w = (n||'').trim().split(/\s+/); return w.length>1 ? `${w[w.length-1]}, ${w.slice(0,-1).join(' ')}` : n; };
/* analyst text uses "Surname, First"; show it as "First Surname" */

}
/* expand the compact tables back into named fields */
function anX(kind, r){

    : {...r, vs:r.vs.map(v=>({batter:v[0], b:v[1], r:v[2], w:v[3], sr:v[4]})), lengths:(r.lengths||[]).map(l=>Array.isArray(l) ? {len:l[0], pct:l[1], balls:l[2], econ:l[3], w:l[4], bdry:l[5]} : l)};
}
/* records for a player: [{n (team innings), rec}] */
function anRecs(g, kind, name){

  return (kind==='bat' ? an.bat : an.bowl).filter(r=>nmSame(r.name, name)).map(r=>({n: r.n||1, rec:anX(kind, r)}));

const encPts = a=>(a||[]).map(x=>x.join(',')).join(';');
const decPts = s=>(s||'').split(';').filter(Boolean).map(x=>{ const [a,b,c] = x.split(','); return [+a, +b, c==='W'?'W':+c]; });
/* keep only what the documents use, compact enough to save with the match */

  an.innings.forEach(i=>{ const k = (i.qld?'q':'o')+i.n; if(!g.scores[k] && !(isLtd(g)?false:sessTotals(g)[k].n)){ const [r,w] = i.score.split('/'); g.scores[k] = `${w}/${r}`; } });
  // batters

  an.bat.forEach(b=>{ let p = find('batters', b.name);
    if(!p){ p = newBatter(); p.name = b.name; p.review = batTemplate(g); g.batters.push(p); }
    const n = b.n, k = 'i'+n;

  });
  // bowlers: figures for each innings from "By innings: inns 2: 2-47 (15) · inns 4: 3-33 (13)"

    const parts = [...(b.notes['By innings']||'').matchAll(/inns (\d+): (\d+)-(\d+) \(([\d.]+)\)/g)].map(m=>({inn:+m[1], w:m[2], r:m[3], o:m[4]}));
    if(!parts.length){ // one innings: work out which from the batters bowled to
      const opp = an.innings.filter(i=>!i.qld); parts.push({inn:b.solo||(opp[0]||{}).inn||2, w:String(b.w), r:String(b.r), o:b.overs, single:true}); }
    parts.forEach(x=>{ const inn = an.innings.find(i=>i.inn===x.inn), n = inn ? inn.n : 1, k = 'i'+n;
      if(has(p[k+'o'])) return;

      if(parts.length===1){ p[k+'m'] = String(b.m); const balls = oversToBalls(x.o); if(has(b.dot)) p[k+'d'] = String(Math.round(num(b.dot)/100*balls)); }

  if(nw) done.push(plural(nw,'bowling innings','bowling innings'));
  // partnerships and milestones the ball-by-ball paste hasn't already filled
  const innOf = t=>{ const m = t.match(/^Inns (\d+)/); const i = m && an.innings.find(x=>x.inn===+m[1]); return i ? i.n : 1; };
  an.lists.parts.forEach(t=>{ const m = t.match(/^Inns \d+: (.+?) & (.+?): (\d+) for the (\w+) wicket/); if(!m) return; const n = String(innOf(t));
    if(g.partnerships.some(p=>p.innings===n && (p.auto===true || num(p.runs)===+m[3]))) return;
    g.partnerships.push(Object.assign(newPartnership(), {runs:m[3], wicket:m[4], batters:`${anName(m[1])} & ${anName(m[2])}`, innings:n, auto:'analyst'})); });
  an.lists.milestones.forEach(t=>{ const m = t.match(/^Inns \d+: (.+?) (\d+) \((\d+) balls/); if(!m) return; const n = String(innOf(t)), name = anName(m[1]), runs = +m[2];
    if(g.batMilestones.some(x=>x.innings===n && nmSame(x.player, name))) return;
    const hit = s.batMilestoneTypes.map(t=>({t, v:parseInt(t)})).filter(o=>!isNaN(o.v) && runs>=o.v).sort((a,b)=>b.v-a.v)[0];
    if(hit) g.batMilestones.push(Object.assign(newMilestone(hit.t), {player:(find('batters',name)||{}).name||name, detail:`${runs} (${m[3]})`, innings:n, auto:true})); });
  an.bowl.forEach(b=>{ const p = find('bowlers', b.name); const parts = [...(b.notes['By innings']||'').matchAll(/inns (\d+): (\d+)-(\d+)/g)];
    (parts.length ? parts.map(x=>({inn:+x[1], w:+x[2], r:+x[3]})) : [{inn:b.solo||(an.innings.find(i=>!i.qld)||{}).inn, w:b.w, r:b.r}]).forEach(x=>{
      const inn = an.innings.find(i=>i.inn===x.inn), n = String(inn ? inn.n : 1);
      if(g.bowlMilestones.some(m=>m.innings===n && nmSame(m.player, b.name))) return;
      const hit = s.bowlMilestoneTypes.map(t=>({t, v:parseInt(t)})).filter(o=>!isNaN(o.v) && x.w>=o.v).sort((a,b)=>b.v-a.v)[0];
      if(hit) g.bowlMilestones.push(Object.assign(newMilestone(hit.t), {player:p?p.name:b.name, detail:`${x.w}/${x.r}`, innings:n, auto:true})); }); });

  if(!(g.positives||'').trim() && an.lists.worked.length) g.positives = an.lists.worked.map(fix).join('\n');
  if(!(g.learnings||'').trim() && an.lists.failed.length) g.learnings = an.lists.failed.map(fix).join('\n');

  const hid = anFillHidden(g); if(hid) done.push(plural(hid,'hidden name'));
  done.push('notes and charts for every player');
  return done;
}

/* ---- Tab 4: Fielding ---- */
function fieldingTotals(games){
  const t = {taken:0, dropped:0, ro:0, dh:0, bs:0, n:0, grades:{}};
  CATCH_GRADES.forEach(([k])=>t.grades[k]={taken:0, dropped:0});
  games.forEach(g=>{ const f = g.fielding||{}; let any = false;
    CATCH_GRADES.forEach(([k])=>{ if(has(f[k+'t'])||has(f[k+'d'])) any = true; t.grades[k].taken += num(f[k+'t']); t.grades[k].dropped += num(f[k+'d']); t.taken += num(f[k+'t']); t.dropped += num(f[k+'d']); });
    ['ro','dh','bs'].forEach(k=>{ if(has(f[k])) any = true; t[k] += num(f[k]); });
    if(any) t.n++; });
  return t;
}
function catchPct(taken, dropped){ return taken+dropped ? Math.round(taken/(taken+dropped)*100)+'%' : '–'; }
function fieldingRowsInner(){
  const t = fieldingTotals([G()]);
  return `<div class="fl ft">Total</div><div class="fc ft">${t.taken}</div><div class="fc ft">${t.dropped}</div><div class="fc ft">${catchPct(t.taken, t.dropped)}</div>`;
}
function setFld(k, v){ const g=G(); g.fielding[k]=v; touchGame(g); live(); }
function tabFielding(g){
  const f = g.fielding;
  const inp = (k, label)=>`<input type="number" min="0" inputmode="numeric" aria-label="${label}" value="${esc(f[k])}" oninput="setFld('${k}',this.value)">`;
  return `${anFieldingHtml(g)}
  <div class="panel">
    <div class="panel-head"><div class="panel-title">Catching</div></div>
    <div class="fld-grid">
      <div></div><div class="fh">Taken</div><div class="fh">Dropped</div><div class="fh">Catch %</div>
      ${CATCH_GRADES.map(([k,l])=>`<div class="fl">${l}</div>${inp(k+'t', l+' taken')}${inp(k+'d', l+' dropped')}<div class="fc" data-live="catchPct" data-arg="${k}">${catchPctFor(k)}</div>`).join('')}
      <span style="display:contents" data-live="fldTotal">${fieldingRowsInner()}</span>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><div class="panel-title">Run outs and ground fielding</div></div>
    <div class="fld-other">
      <div><div class="mini-label">Run outs</div>${inp('ro','Run outs')}</div>
      <div><div class="mini-label">Direct hits</div>${inp('dh','Direct hits')}</div>
      <div><div class="mini-label">Boundary saves</div>${inp('bs','Boundary saves')}</div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><div class="panel-title">Fielding summary</div></div>
    <textarea class="xl" oninput="setG('fielding.notes',this.value)">${esc(f.notes)}</textarea>
  </div>`;
}
function catchPctFor(k){ const f = G().fielding; return catchPct(num(f[k+'t']), num(f[k+'d'])); }
function fieldingHasData(t){ return t.n>0; }
function fieldingText(t){
  return [`Catches ${t.taken}/${t.taken+t.dropped} (${catchPct(t.taken,t.dropped)})`, t.ro?plural(t.ro,'run out'):'', t.dh?plural(t.dh,'direct hit'):'', t.bs?plural(t.bs,'boundary save'):''].filter(Boolean).join(', ');
}
function fieldingTable(t){
  const rows = CATCH_GRADES.map(([k,l])=>[l, t.grades[k].taken, t.grades[k].dropped, catchPct(t.grades[k].taken, t.grades[k].dropped)]);
  rows.push(['Total', t.taken, t.dropped, catchPct(t.taken, t.dropped)]);
  return {t:'table', head:['Catches','Taken','Dropped','Catch %'], rows, totals:1};
}
function anFieldingHtml(g){
  const an = g.analyst; if(!an) return '';
  const f = an.field, it = f.items||{};
  const rows = [['Catches', f.catches.map(([n,c])=>`${n} ${c}`).join(', ')], ['Run outs / stumpings', it['Run-outs / stumpings']], ['Missed chances', it['Missed chances (coded)']], ['Chance conversion', it['Chance conversion (coded chances)']], ['Keeper', anText(g, it.Keeper||'')]].filter(([,v])=>v);
  return `<div class="panel"><div class="panel-head"><div class="panel-title">From the analyst</div></div>
    <div class="an-kv">${rows.map(([l,v])=>`<div><span>${l}</span><b>${esc(v)}</b></div>`).join('')}</div>
    ${(f.lapses||[]).length ? `<div class="mini-label" style="margin-top:12px;">Dropped chances</div><ul class="an-list">${f.lapses.map(t=>`<li>${esc(anText(g,t))}</li>`).join('')}</ul>` : ''}</div>`;
}
function anFieldingBlocks(g){
  const an = g.analyst; if(!an) return [];
  const b = [];
  if(an.field.catches.length) b.push({t:'small', text:`Catches: ${an.field.catches.map(([n,c])=>`${n} ${c}`).join(', ')}`});
  (an.field.lapses||[]).forEach(t=>b.push({t:'small', text:`Dropped: ${anText(g,t)}`}));
  return b;
}
function fieldingBlocks(g, withHead){
  const t = fieldingTotals([g]), notes = (g.fielding.notes||'').trim(), anb = anFieldingBlocks(g);
  const pfAny = Object.values(g.pfield||{}).some(f=>has(f.c)||has(f.d)||has(f.ro)||(f.notes||'').trim());
  if(!fieldingHasData(t) && !notes && !anb.length && !pfAny) return [];
  const b = withHead ? [{t:'h', text:L('tab.fielding')}] : [];
  b.push(...anb);
  if(fieldingHasData(t)){
    if(t.taken+t.dropped) b.push(fieldingTable(t));
    b.push({t:'kv', rows:[['Run outs', t.ro], ['Direct hits', t.dh], ['Boundary saves', t.bs]]});
  }
  if(notes) b.push({t:'p', text:notes});
  const pf = Object.entries(g.pfield||{}).map(([k,f])=>{ const p = [...g.batters, ...g.bowlers].find(x=>pkey(x.name)===k); return p ? {name:p.name, f} : null; }).filter(x=>x && (has(x.f.c)||has(x.f.d)||has(x.f.ro)||(x.f.notes||'').trim()));
  if(pf.some(x=>has(x.f.c)||has(x.f.d)||has(x.f.ro))) b.push({t:'table', head:['Player','Catches','Dropped','Run outs'], rows:pf.map(x=>[x.name, num(x.f.c), num(x.f.d), num(x.f.ro)])});
  pf.filter(x=>(x.f.notes||'').trim()).forEach(x=>b.push({t:'small', text:`${x.name}: ${x.f.notes.trim()}`}));
  return b;
}

function seasonSessionRows(s){
  s = {...s, games: s.games.filter(g=>!isLtd(g))};
  const rows = SESSIONS.map(n=>{
    const t = {q:{r:0,w:0,n:0,b:0}, o:{r:0,w:0,n:0,b:0}};
    s.games.forEach(g=>{ const x = sessTotals(g, (d,nn)=>nn===n); ['q','o'].forEach(k=>{ t[k].r+=x[k].r; t[k].w+=x[k].w; t[k].n+=x[k].n; t[k].b+=x[k].b; }); });
    const res = {won:0, even:0, lost:0};
    s.games.forEach(g=>Object.entries(g.sessionResults||{}).forEach(([k,v])=>{ if(/^d\d/.test(k) && k.endsWith('s'+n) && res[v]!==undefined) res[v]++; }));
    return {n, ...t, res};
  });
  return rows.some(r=>r.q.n||r.o.n||r.res.won||r.res.even||r.res.lost) ? rows : null;
}

function playerTable(disc, rows, s){

/* ============================= CHARTS ============================= */
function splitLabel(t){ const w=t.split(' '); if(w.length<3) return [t]; const h=Math.ceil(w.length/2); return [w.slice(0,h).join(' '), w.slice(h).join(' ')]; }
function radarSVG(vals, latest){
  const W=520, H=360, cx=260, cy=176, R=108, N=WTP_KEYS.length;
  const ang = i=>-Math.PI/2 + i*2*Math.PI/N;
  const pt = (i,v)=>[cx+Math.cos(ang(i))*R*v/5, cy+Math.sin(ang(i))*R*v/5];
  const poly = arr=>arr.map((v,i)=>pt(i,v).map(n=>n.toFixed(1)).join(',')).join(' ');
  let g = '';
  for(let r=1;r<=5;r++) g += `<polygon points="${poly(WTP_KEYS.map(()=>r))}" fill="none" stroke="rgba(27,31,28,${r===5?0.18:0.08})"/>`;
  WTP_KEYS.forEach((k,i)=>{ const [x,y]=pt(i,5); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(27,31,28,0.1)"/>`; });
  g += `<polygon points="${poly(vals)}" fill="rgba(110,27,60,0.18)" stroke="#6E1B3C" stroke-width="2.2" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{ if(v>0){ const [x,y]=pt(i,v); g += `<circle cx="${x}" cy="${y}" r="4" fill="#6E1B3C"/>`; } });
  if(latest && latest.some(v=>v>0)) g += `<polygon points="${poly(latest)}" fill="none" stroke="#E0A23E" stroke-width="2" stroke-dasharray="5 4"/>`;
  WTP_KEYS.forEach((k,i)=>{
    const [x,y] = pt(i,6.15); const c = Math.cos(ang(i)), sn = Math.sin(ang(i));
    const anchor = Math.abs(c)<0.1 ? 'middle' : (c>0?'start':'end');
    const lines = splitLabel(wtpLabel(k)); const dy = sn<-0.9 ? -(lines.length)*15+4 : (sn>0.3 ? 8 : -(lines.length-1)*7.5+2);
    g += `<text x="${x}" y="${y+dy}" text-anchor="${anchor}" font-family="Inter,sans-serif" font-size="12.5" font-weight="600" fill="#1B1F1C">${lines.map((l,j)=>`<tspan x="${x}" dy="${j?15:0}">${esc(l)}</tspan>`).join('')}</text>`;
    g += `<text x="${x}" y="${y+dy+lines.length*15}" text-anchor="${anchor}" font-family="Fraunces,Georgia,serif" font-size="14" font-weight="650" fill="#6E1B3C">${vals[i]?f1(vals[i]):'–'}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Way to Play radar chart">${g}</svg>`;
}
function trendSVG(games){
  const W=820, H=250, Lp=36, Rt=18, T=16, B=40;
  const n = games.length, xs = i=> n===1 ? (Lp+(W-Rt))/2 : Lp + i*(W-Lp-Rt)/(n-1);
  const ys = v=> T + (5-v)*(H-T-B)/4;
  let g = '';
  for(let v=1;v<=5;v++) g += `<line x1="${Lp}" x2="${W-Rt}" y1="${ys(v)}" y2="${ys(v)}" stroke="rgba(27,31,28,0.08)"/><text x="${Lp-12}" y="${ys(v)+4}" text-anchor="end" font-family="Inter,sans-serif" font-size="11" fill="#565F59">${v}</text>`;
  games.forEach((gm,i)=>{ g += `<text x="${xs(i)}" y="${H-B+22}" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#565F59">R${esc(gm.round)}</text>`; });
  WTP_KEYS.forEach((k,ci)=>{
    const pts = games.map((gm,i)=>({x:xs(i), v:gm.wtp[k].rating})).filter(p=>p.v>0);
    const off = (ci-(WTP_KEYS.length-1)/2)*1.4;
    if(pts.length>1) g += `<polyline points="${pts.map(p=>`${p.x},${ys(p.v)+off}`).join(' ')}" fill="none" stroke="${WTP_COLORS[ci]}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{ g += `<circle cx="${p.x}" cy="${ys(p.v)+off}" r="3.6" fill="${WTP_COLORS[ci]}" stroke="#FBFAF6" stroke-width="1.5"/>`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Way to Play ratings by round">${g}</svg>`;
}

function msTableBlock(rows, ltd){

    : {t:'table', head:['Player','Milestone','Detail','Innings'], rows:rows.map(m=>[m.player||'–', m.type||'–', m.detail||'–', inningsText(m.innings)])};
}
function partTableBlock(g, parts){
  return isLtd(g) ? {t:'table', head:['Runs','Wicket','Batters'], rows:parts.map(p=>[p.runs, p.wicket||'–', p.batters||'–'])}
    : {t:'table', head:['Runs','Wicket','Batters','Innings'], rows:parts.map(p=>[p.runs, p.wicket||'–', p.batters||'–', p.innings==='2'?'2nd inns':'1st inns'])};
}
function batMeta(g, x){ return [batFig(x), batRates(x)].filter(Boolean).join('   '); }
function bowlMeta(g, x){ return [bowlFig(x), bowlRates(x)].filter(Boolean).join('   '); }
/* Session breakdown laid out like the dressing-room sheet: days across, sessions down. */
function innTotalsBlock(g){ return {t:'kv', rows:innCells(g).map(([l,x])=>[l, fmtWR(x)])}; }
function sessionGridBlock(g){
  const days = DAYS.filter(d=>SESSIONS.some(n=>g.sessions[`d${d}s${n}`].some(slotText) || (g.sessionResults||{})[`d${d}s${n}`]));
  const inn = slotInnings(g), o = oppShort(g);
  const cell = (d,n)=>{
    const sl = g.sessions[`d${d}s${n}`];
    const lines = sl.filter(x=>slotText(x)).map(x=>`${x.role==='bat'?'Bat':'Bowl'}, ${innLabel(inn.get(x)||1)}: ${slotText(x)}`);
    const res = (g.sessionResults||{})[`d${d}s${n}`];
    if(res) lines.unshift(`Session ${res}`);
    return lines.join('\n') || '–';
  };
  const rows = SESSIONS.map(n=>[`Session ${n}`, ...days.map(d=>cell(d,n))]);
  rows.push(['Day total', ...days.map(d=>dayLines(g,d).map(l=>`${l.team} ${l.score}${l.overs?` (${l.overs})`:''} ${l.inn}`).join('\n')||'–')]);
  return {t:'table', head:['', ...days.map(d=>`Day ${d}`)], rows, left:true, totals:1};
}
function md_sessionBlocks(g){
  const t = sessResultTally([g]), any = t.won+t.even+t.lost;

  return [sessionGridBlock(g), ...(any?[{t:'small', text:`Sessions: ${tallyText(t)}`}]:[])];

function playerBrief(b, x, meta){

function matchReportBlocks(g, s, mode){

/* One-page version: everything the reader needs at a glance, no individual reviews. */
/* ---- Coaches' brief: one page, player names link to attached reviews ---- */
function briefBlocks(g, s){
  const b = [], url = safeUrl(g.scorecardUrl), sc = scoresLine(g), o = g.opponent||'Opponent';
  b.push({t:'title', text:`${L('gs.round')} ${g.round||'–'} v ${g.opponent||'Opponent TBC'}${g.result?`: ${g.result.toUpperCase()}`:''}`,
    sub:[isLtd(g)?FORMATS[fmtOf(g)].label:'', g.venue, fmtDate(g.date)].filter(Boolean).join(', ') || `${progName()}, Season ${s.name}`});
  if(url) b.push({t:'button', text:'View full scorecard', href:url});
  const ft = fieldingTotals([g]);
  b.push({t:'kv', rows:[['QLD', sc.q||'–'], [o, sc.o||'–'], ...(fieldingHasData(ft)?[[L('tab.fielding'), fieldingText(ft)]]:[])]});
  const t = sessResultTally([g]);
  if(t.won+t.even+t.lost) b.push({t:'tally', won:t.won, even:t.even, lost:t.lost, unit:isLtd(g)?'blocks':'sessions'});

  if((g.summary||'').trim()) b.push({t:'h', text:'The game'}, {t:'p', text:g.summary});
  const focus = (g.focus||'').split('\n').map(l=>l.replace(/^\s*(\d+[.)]|[-•*])\s*/,'').trim()).filter(Boolean);
  if(focus.length) b.push({t:'focus', title:L('gs.focus'), items:focus});

  // top performers: most runs and most wickets across the match
  const runsOf = x=> num(x.i1r)+num(x.i2r);
  const wktsOf = x=> num(x.i1w)+num(x.i2w), concOf = x=> num(x.i1r)+num(x.i2r);
  const topBat = g.batters.filter(x=>(x.name||'').trim() && runsOf(x)>0).sort((a,c)=>runsOf(c)-runsOf(a)).slice(0,4);
  const topBowl = g.bowlers.filter(x=>(x.name||'').trim() && wktsOf(x)>0).sort((a,c)=>wktsOf(c)-wktsOf(a) || concOf(a)-concOf(c)).slice(0,4);
  const batLine = x=>[has(x.i1r)?`${num(x.i1r)}${x.i1no?'*':''}`:'', has(x.i2r)?`${num(x.i2r)}${x.i2no?'*':''}`:''].filter(Boolean).join(' & ');
  const bowlLine = x=>[has(x.i1o)?`${num(x.i1w)}/${num(x.i1r)}`:'', has(x.i2o)?`${num(x.i2w)}/${num(x.i2r)}`:''].filter(Boolean).join(' & ');
  if(topBat.length || topBowl.length) b.push({t:'h', text:'Top performers'}, {t:'top',
    bat: topBat.map(x=>({name:x.name, fig:batLine(x), files:x.files||[]})),
    bowl: topBowl.map(x=>({name:x.name, fig:bowlLine(x), files:x.files||[]}))});

  // way to play: one tile per category
  if(WTP_KEYS.some(k=>g.wtp[k].rating)) b.push({t:'h', text:L('tab.wtp')}, {t:'wtp',
    items: WTP_KEYS.map(k=>({label:wtpLabel(k), rating:g.wtp[k].rating||0, word:wtpScale(g.wtp[k].rating)}))});

  // every attached player review, one click each
  const people = new Map();
  const addFiles = (x, kind)=>{ const n=(x.name||'').trim(); if(!n || !(x.files||[]).length) return;
    const k=pkey(n); if(!people.has(k)) people.set(k, {name:n, files:[]});
    const p=people.get(k); x.files.forEach((f,i)=>{ if(!p.files.some(y=>y.url===f.url)) p.files.push({kind: x.files.length>1?`${kind} ${i+1}`:kind, url:f.url}); }); };
  g.batters.forEach(x=>addFiles(x,'Batting')); g.bowlers.forEach(x=>addFiles(x,'Bowling'));
  if(people.size) b.push({t:'h', text:'Player reviews'}, {t:'reviews', items:[...people.values()]});
  return b;
}

function blocksToText(blocks){

      case 'h': return `\n${b.text.toUpperCase()}\n${'-'.repeat(b.text.length)}`;

      case 'p': return (b.text||'').trim() || 'Not recorded.';
      case 'small': return b.text;
      case 'chips': return b.items.join(', ');
      case 'kv': return b.rows.map(([k,v])=>`${k}: ${isLink(v)?v.link:v}`).join('\n');
      case 'button': case 'linkline': return `${b.text}: ${b.href}`;
      case 'tally': return `${b.unit==='blocks'?'Blocks':'Sessions'}: won ${b.won}, even ${b.even}, lost ${b.lost}`;
      case 'list': return b.items.map((x,i)=>`${i+1}. ${x}`).join('\n');
      case 'top': return [b.bat.length?'Batting: '+b.bat.map(r=>`${r.name} ${r.fig}`).join('; '):'', b.bowl.length?'Bowling: '+b.bowl.map(r=>`${r.name} ${r.fig}`).join('; '):''].filter(Boolean).join('\n');
      case 'wtp': return b.items.map(it=>`${it.label}: ${it.rating?'●'.repeat(it.rating)+'○'.repeat(5-it.rating)+` ${it.rating}/5 (${it.word})`:'Not rated'}`).join('\n');
      case 'reviews': return b.items.map(r=>`${r.name}: `+r.files.map(f=>f.url).join(' and ')).join('\n');
      case 'focus': return `\n${b.title.toUpperCase()}\n${'-'.repeat(b.title.length)}\n` + b.items.map((x,i)=>`${i+1}. ${x}`).join('\n');
      case 'players': return b.rows.map(r=>`${r.name}  ${r.fig||''}${r.files.length?`  (review: ${r.files.map(f=>f.url).join(', ')})`:''}`).join('\n');
      case 'table': return [b.head.join(' | '), ...b.rows.map(r=>r.map(c=>String(c).replace(/\n/g,', ')).join(' | '))].join('\n');

async function copyReport(blocks, plain){
  const html = blocksToHTML(blocks), text = blocksToText(blocks);
  try{
    if(plain) await navigator.clipboard.writeText(text);
    else await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}), 'text/plain':new Blob([text],{type:'text/plain'})})]);
    toast(plain ? 'Plain text copied' : 'Copied for email');
  }catch(e){
    const box = document.createElement(plain?'textarea':'div');
    if(plain) box.value = text; else { box.innerHTML = html; box.contentEditable = 'true'; }
    box.style.cssText = 'position:fixed;left:-9999px;top:0;'; document.body.appendChild(box);
    if(plain) box.select(); else { const r=document.createRange(); r.selectNodeContents(box); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    const ok = document.execCommand('copy'); box.remove(); getSelection().removeAllRanges();
    toast(ok ? 'Copied' : 'Copy was blocked by the browser, use Download HTML instead');
  }
}

  details[open] summary .rm{background:#F4F1E8;color:#6E1B3C;}
  details[open] summary .rm::after{content:"Close";}
  .body{padding:0 16px 14px;border-top:1px solid #E6E1D4;}
  .empty{color:#8A918C;font-style:italic;font-size:14px;}
  @media print{body{background:#fff;padding:0} .sheet{padding:0} .toggle-all,summary .rm{display:none} details{border:none;background:#fff}}
</style></head>
<body><div class="sheet">
${logo}${blocksToHTML(sum)}
<div class="more">
  <h2>Full detail</h2>

  ${secs.map(sec=>`<details id="${sec.id}"><summary><span class="t">${esc(sec.title)}${sec.count?`<span class="c">${esc(sec.count)}</span>`:''}</span><span class="rm"></span></summary>

<script>
function toggleAll(btn){var d=document.querySelectorAll('details');var open=btn.textContent==='Open all';d.forEach(function(x){x.open=open;});btn.textContent=open?'Close all':'Open all';}
window.addEventListener('beforeprint',function(){document.querySelectorAll('details').forEach(function(x){x.open=true;});});
<\/script>
</body></html>`;
}
function reviewFileName(g){ return `Round-${g.round||'X'}-v-${(g.opponent||'TBC')}-review`.replace(/[^\w\-]+/g,'-').replace(/-+/g,'-') + '.html'; }
function downloadReviewFile(){
  const g = G(), blob = new Blob([reviewFileDoc(g, S())], {type:'text/html'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = reviewFileName(g);
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('Review file downloaded, attach it to your email');
}
function previewReviewFile(){
  const w = window.open('', '_blank');
  if(!w){ toast('Allow pop-ups to preview the review file'); return; }
  w.document.write(reviewFileDoc(G(), S())); w.document.close();
}
function downloadReport(blocks, name){
  const blob = new Blob([fullDoc(blocks)], {type:'text/html'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = name.replace(/[^\w\-]+/g,'-').replace(/-+/g,'-') + '.html';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('Report downloaded');
}
function printReport(blocks){
  const w = window.open('', '_blank');
  if(!w){ toast('Allow pop-ups to print, or use Download HTML'); return; }
  w.document.write(fullDoc(blocks)); w.document.close(); w.focus(); setTimeout(()=>w.print(), 400);
}

/* ============================= SETTINGS ============================= */
function openSettings(){ renderSettings(); }
/* ---- Combine a player's batting and bowling PDFs into one file ---- */
let pdfLibLoading = null;
function loadPdfLib(){
  if(window.PDFLib) return Promise.resolve();
  if(pdfLibLoading) return pdfLibLoading;
  const srcs = ['https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js','https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js'];
  pdfLibLoading = new Promise((res, rej)=>{
    const tryNext = i=>{ if(i>=srcs.length){ pdfLibLoading=null; rej(new Error('load')); return; }
      const sc = document.createElement('script'); sc.src = srcs[i]; sc.onload = ()=>res(); sc.onerror = ()=>{ sc.remove(); tryNext(i+1); }; document.head.appendChild(sc); };
    tryNext(0);
  });
  return pdfLibLoading;
}
function openCombine(list, id){
  const p = G()[list].find(x=>x.id===id); const name = (p && p.name || '').trim() || 'Player';
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-back" onclick="if(event.target===this)closeModal()">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Combine PDFs" style="max-width:480px;">
      <div class="modal-head"><div class="modal-title">${esc(name)}</div><button class="icon-btn" onclick="closeModal()" aria-label="Close">×</button></div>
      <div class="modal-body">
        <label class="field-label">Batting review (PDF)</label><input type="file" id="cb-bat" accept="application/pdf,.pdf">
        <label class="field-label">Bowling review (PDF)</label><input type="file" id="cb-bowl" accept="application/pdf,.pdf">
        <div class="btn-row" style="margin-top:16px;"><button class="primary-btn" id="cb-go" onclick="combinePdfs('${esc(name).replace(/'/g,"\\'")}')">Combine and download</button></div>
        <div class="hint" id="cb-msg">Upload the combined file to OneDrive, then attach its link here.</div>
      </div>
    </div>
  </div>`;
}
async function combinePdfs(name){
  const files = [document.getElementById('cb-bat').files[0], document.getElementById('cb-bowl').files[0]].filter(Boolean);
  const msg = document.getElementById('cb-msg'), btn = document.getElementById('cb-go');
  if(!files.length){ msg.textContent = 'Choose at least one PDF.'; return; }
  btn.disabled = true; msg.textContent = 'Combining…';
  try{
    await loadPdfLib();
    const out = await PDFLib.PDFDocument.create();
    for(const f of files){
      const src = await PDFLib.PDFDocument.load(await f.arrayBuffer(), {ignoreEncryption:true});
      (await out.copyPages(src, src.getPageIndices())).forEach(pg=>out.addPage(pg));
    }
    const blob = new Blob([await out.save()], {type:'application/pdf'});
    const g = G(), a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${name} - Round ${g.round||''} review.pdf`.replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ');
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    msg.textContent = `Done: ${out.getPageCount()} page${out.getPageCount()===1?'':'s'}. Upload it to OneDrive, then attach its link here.`;
  }catch(e){
    console.warn(e);
    msg.textContent = e && e.message==='load' ? 'Could not load the PDF tool. Check your internet connection and try again.' : 'One of those files could not be read as a PDF.';
  }
  btn.disabled = false;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function renderSettings(openGroup){
  const cur = db.activeSeasonId;
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-back" onclick="if(event.target===this)closeModal()">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="modal-head"><div class="modal-title">Settings</div><button class="icon-btn" onclick="closeModal()" aria-label="Close">×</button></div>
      <div class="modal-body">
        <div class="modal-section">
          <h3>Logo</h3>
          <div class="logo-row">
            <div class="logo-preview">${db.logo?`<img src="${esc(db.logo)}" alt="">`:'No logo'}</div>
            <label class="ghost-btn" style="cursor:pointer;">${db.logo?'Replace logo':'Upload logo'}<input type="file" accept="image/png,image/svg+xml,image/jpeg,image/webp" style="display:none" onchange="uploadLogo(this.files[0])"></label>
            ${db.logo?`<button class="tool-btn danger" onclick="removeLogo()">Remove</button>`:''}
          </div>
          <div class="hint">Use the official file, ideally a PNG or SVG with a transparent background. It sits on the maroon header.</div>
        </div>

        <div class="modal-section">
          <h3>Labels</h3>
          ${LABEL_DEFS.map((grp,gi)=>`<details class="lbl-group" ${openGroup===gi?'open':''}><summary>${esc(grp.group)}</summary><div class="lbl-rows">
            ${grp.items.map(([k,d])=>`<label class="lbl-row"><span>${esc(d.length>40?d.slice(0,40)+'…':d)}</span><input type="text" value="${esc(db.labels[k]||'')}" placeholder="${esc(d)}" onchange="setLabel('${k}',this.value,${gi})"></label>`).join('')}
          </div></details>`).join('')}
          <div class="btn-row" style="margin-top:6px;"><button class="tool-btn" onclick="resetLabels()">Reset all labels</button></div>
        </div>

        <div class="modal-section">
          <h3>Seasons: ${esc(progName())}</h3>
          ${PS().map(s=>`<div class="season-row">
            <input type="text" value="${esc(s.name)}" aria-label="Season name" onchange="renameSeason('${s.id}',this.value)">
            ${s.id===cur?'<span class="tag cur">Open</span>':`<button class="tool-btn" onclick="closeModal();switchSeason('${s.id}')">Open</button>`}
            <button class="tool-btn" onclick="toggleArchive('${s.id}')">${s.archived?'Restore':'Archive'}</button>
            ${PS().length>1?`<button class="tool-btn danger" onclick="deleteSeason('${s.id}')">Delete</button>`:''}
          </div>`).join('')}
          <div class="inline-add"><input type="text" id="new-season" value="${esc(nextSeasonName())}"><button onclick="createSeason()">Start new season</button></div>
        </div>

        <div class="modal-section">
          <h3>JSONBin</h3>
          <div class="hint" style="margin-top:0;">${SYNC_TEXT[syncState]}.${syncState==='error'&&lastSyncError?` <b style="color:var(--red)">${esc(lastSyncError)}.</b>`:''}${cfg.binId?` Index bin <span class="code">${esc(cfg.binId)}</span>. Use this id on another device to open the same data.`:''}</div>
          <label class="field-label">API key (X-Master-Key)</label>
          <input type="password" id="cfg-key" value="${esc(cfg.apiKey)}" autocomplete="off">
          <label class="field-label">Index bin id</label>
          <input type="text" id="cfg-bin" value="${esc(cfg.binId)}">
          <div class="btn-row" style="margin-top:12px;"><button class="primary-btn" onclick="saveConnection()">Save and connect</button><button class="ghost-btn" onclick="reloadCloud()">Reload from JSONBin</button></div>
          ${binsInUseHtml()}
        </div>

        <div class="modal-section">
          <h3>Backup</h3>
          <div class="btn-row"><button class="ghost-btn" onclick="exportBackup()">Download backup</button>
            <label class="ghost-btn" style="cursor:pointer;">Restore from backup<input type="file" accept="application/json,.json" style="display:none" onchange="importBackup(this.files[0])"></label></div>
        </div>
      </div>
    </div>
  </div>`;
}
/* Lists every bin this device is using, so old ones can be safely deleted on jsonbin.io. */
function binsInUseHtml(){
  if(!cfg.apiKey || !cfg.binId) return '';
  const rows = [['Index', cfg.binId]];
  db.seasons.forEach(se=>{
    if(se._bin) rows.push([`Season ${se.name}${se.archived?' (archived)':''}`, se._bin]);
    (se.games||[]).forEach(g=>{ if(g._bin) rows.push([`${se.name}: ${gameTitle(g)}`, g._bin]); });
  });
  return `<details class="lbl-group" style="margin-top:14px;"><summary>Bins in use on this device (${rows.length})</summary>
    <div class="lbl-rows">${rows.map(([l,id])=>`<div class="lbl-row"><span>${esc(l)}</span><span class="code">${esc(id)}</span></div>`).join('')}</div></details>`;
}
function setLabel(k, v, gi){
  v = (v||'').trim();
  if(!v || v===LABEL_DEFAULTS[k]) delete db.labels[k]; else db.labels[k] = v;
  touchIndex(); render();
}
function resetLabels(){
  if(!confirm('Put every label back to its original wording?')) return;
  db.labels = {}; touchIndex(); render(); renderSettings();
}
function uploadLogo(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const maxH = 96, maxW = 320;
      const scale = Math.min(1, maxH/img.height, maxW/img.width);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width*scale)); c.height = Math.max(1, Math.round(img.height*scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const png = c.toDataURL('image/png'), webp = c.toDataURL('image/webp', 0.9);
      db.logo = (webp.startsWith('data:image/webp') && webp.length < png.length) ? webp : png;
      touchIndex(); render(); renderSettings(); toast('Logo updated');
    };
    img.onerror = ()=>toast('That image could not be read');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function removeLogo(){ db.logo=''; touchIndex(); render(); renderSettings(); }
function nextSeasonName(){
  const ps = PS(); if(!ps.length) return ''; const last = ps[ps.length-1].name; const m = String(last).match(/^(\d{4})\/(\d{2})$/);
  return m ? `${+m[1]+1}/${String((+m[2]+1)%100).padStart(2,'0')}` : '';
}
function renameSeason(id, v){ const s=db.seasons.find(x=>x.id===id); s.name=v.trim()||s.name; if(!s.stub) touchSeason(s); touchIndex(); render(); }
function toggleArchive(id){
  const s = db.seasons.find(x=>x.id===id); s.archived = !s.archived;
  if(!s.stub) touchSeason(s); touchIndex(); render(); renderSettings();
}
function createSeason(){
  const name = document.getElementById('new-season').value.trim(); if(!name) return;
  const prev = S(); const s = newSeason(name, prev && !prev.stub && prev.programId===P() ? prev : null, P());
  db.seasons.push(s); db.activeSeasonId = s.id; db.programSeason[P()] = s.id;
  touchSeason(s); touchIndex(); closeModal(); go('dashboard'); toast(`Season ${name} started`);
}
function deleteSeason(id){
  const s = db.seasons.find(x=>x.id===id);
  if(!confirm(`Delete season ${s.name} and every match review in it? This can't be undone.`)) return;
  (s.games||[]).forEach(g=>jbDelete(g._bin)); jbDelete(s._bin);
  db.seasons = db.seasons.filter(x=>x.id!==id);
  [...dirty].forEach(k=>{ if(k.includes(id)) dirty.delete(k); });
  if(db.activeSeasonId===id){ const ps = PS(); db.activeSeasonId = (ps.find(x=>!x.archived)||ps[0]).id; db.programSeason[P()] = db.activeSeasonId; }
  touchIndex(); go('dashboard'); renderSettings();
}
async function saveConnection(){
  cfg.apiKey = document.getElementById('cfg-key').value.trim();
  const newBin = document.getElementById('cfg-bin').value.trim();
  const changed = newBin !== cfg.binId;
  cfg.binId = newBin; saveCfg(); closeModal();
  if(!cfg.apiKey){ setSync('local'); render(); toast('Saving in this browser only'); return; }
  if(cfg.binId && changed){
    dirty.clear();
    try{ localStorage.removeItem(LS_DATA); }catch(e){}
    document.getElementById('app').innerHTML = '<div class="loading">Connecting to JSONBin&hellip;</div>';
    view = resetView('dashboard');
    await boot(); toast(syncState==='error'?'Could not reach that bin':'Connected to JSONBin');
  }else{ markAllDirty(); render(); }
}
async function reloadCloud(){
  if(!cfg.apiKey || !cfg.binId){ toast('Nothing saved to JSONBin yet'); return; }
  if(dirty.size && !confirm('Some changes have not synced yet. Reload anyway and discard them?')) return;
  dirty.clear(); try{ const l=JSON.parse(localStorage.getItem(LS_DATA)||'null'); if(l){ l.pending=false; localStorage.setItem(LS_DATA, JSON.stringify(l)); } }catch(e){}
  closeModal(); document.getElementById('app').innerHTML = '<div class="loading">Loading from JSONBin&hellip;</div>';
  await boot();
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `qld-2nd-xi-review-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
function importBackup(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!Array.isArray(data.seasons)) throw new Error('Not a backup');
      if(!confirm('Replace the current data with this backup?')) return;
      db = data; normDb(); markAllDirty(); closeModal(); go('dashboard'); toast('Backup restored');
    }catch(e){ toast('That file is not a Season Review backup'); }
  };
  r.readAsText(file);
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

{ const q = new URLSearchParams(location.search); if(q.get('review')) showSharedReview(q); else boot(); }
